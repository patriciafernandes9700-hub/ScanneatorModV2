name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Add BepInEx NuGet
        run: dotnet nuget add source https://bepinex.dev -n BepInEx
      - name: Build
        run: dotnet build --configuration Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ScanneatorMod-Android
          path: bin/Release/net6.0/ScanneatorMod.dll
