name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Add NuGet Sources
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor
          dotnet nuget add source https://nuget.samboy.dev/v3/index.json -n Samboy
      - name: Build
        run: dotnet build --configuration Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ScanneatorMod-Android
          path: bin/Release/net6.0/ScanneatorMod.dll
defaults:
  
